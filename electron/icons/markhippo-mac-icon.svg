<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="MarkHippo macOS app icon">
  <title>MarkHippo macOS icon</title>
  <!--
    The mark from src/img/markhippo.svg, placed on the macOS app-icon grid as
    JsonHippo's and Chip Hippo's are: the 512-unit artwork scaled by 826/512
    (= 1.61328125) and offset 99px, so the rounded square fills a centred
    826×826 region of the 1024 canvas with a TRANSPARENT margin on every side
    (Big Sur's 824/100 safe area, one pixel larger each way). Without that
    margin the dock draws the icon visibly larger than every other app's.
    Keep the art in step with src/img/markhippo.svg; `make icons` rasterises both.
  -->
  <g transform="translate(99,99) scale(1.61328125)">
    <rect width="512" height="512" rx="114" fill="#E06000"/>
    <g fill="#FFFFFF">
      <circle cx="170" cy="146" r="40"/>
      <circle cx="342" cy="146" r="40"/>
      <rect x="144" y="140" width="224" height="190" rx="74"/>
      <rect x="118" y="260" width="276" height="150" rx="74"/>
    </g>
    <circle cx="201" cy="198" r="17" fill="#E06000"/>
    <circle cx="311" cy="198" r="17" fill="#E06000"/>
    <path d="M200 370 L200 306 L256 346 L312 306 L312 370 M294 352 L312 370 L330 352" fill="none" stroke="#E06000" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
